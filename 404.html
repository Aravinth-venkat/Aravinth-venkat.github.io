<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>404 | Lost in the Network</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050b14;color:#eef7ff;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:20px;text-align:center}
main{width:min(680px,94vw);padding:clamp(25px,6vw,55px);border:1px solid #24425f;border-radius:28px;background:linear-gradient(145deg,#0d1e32,#08111e);box-shadow:0 30px 100px #0009}
h1{font-size:clamp(54px,12vw,110px);margin:0;background:linear-gradient(90deg,#56d7ff,#8c7bff);-webkit-background-clip:text;color:transparent}
h2{margin:0 0 8px}.muted{color:#9db0c5}.game{position:relative;margin:24px auto;width:min(420px,90vw);height:230px;border:1px solid #315271;border-radius:18px;background:#06101b;overflow:hidden}
canvas{width:100%;height:100%;display:block}.btn{display:inline-block;margin:15px 7px 0;padding:11px 17px;border-radius:12px;text-decoration:none;font-weight:900;border:1px solid #2c4862;color:#fff}.primary{background:linear-gradient(100deg,#56d7ff,#8c7bff);color:#03101c;border:0}
small{color:#71879d}
</style></head>
<body><main>
<div>🌐 📡</div><h1>404</h1><h2>Looks like we lost the connection.</h2><p class="muted">The page doesn't exist or the network took a wrong turn. While you're here, play a tiny network-runner game.</p>
<div class="game"><canvas id="game" width="840" height="460"></canvas></div>
<p class="muted"><b>Controls:</b> tap / click / Space to jump. Avoid the packets.</p>
<a class="btn primary" href="/">← Back to portfolio</a><button class="btn" onclick="location.reload()">Try again</button>
<small>Score: <span id="score">0</span></small>
</main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;
let p={x:90,y:370,w:34,h:45,vy:0},obs=[],score=0,over=false,last=0,speed=6;
function jump(){if(p.y>=370){p.vy=-15;if(over)reset()}}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});
c.addEventListener('pointerdown',jump);
function reset(){p.y=370;p.vy=0;obs=[];score=0;over=false;last=0;requestAnimationFrame(loop)}
function draw(){
x.clearRect(0,0,W,H);x.strokeStyle='#17304a';x.lineWidth=2;
for(let i=0;i<9;i++){x.beginPath();x.moveTo(0,60+i*45,W,60+i*45);x.stroke()}
x.fillStyle='#56d7ff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#06101b';x.fillRect(p.x+22,p.y+9,6,6);
x.fillStyle='#8c7bff';obs.forEach(o=>{x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#56d7ff';x.fillRect(o.x+6,o.y+7,5,5);x.fillStyle='#8c7bff'});
x.fillStyle='#9db0c5';x.font='20px system-ui';x.fillText('NETWORK RUNNER',20,32);
if(over){x.fillStyle='#fff';x.font='34px system-ui';x.fillText('Connection lost — tap to restart',155,220)}
}
function loop(t){if(over){draw();return}let dt=Math.min(32,t-(last||t));last=t;p.vy+=.75;p.y+=p.vy;if(p.y>370){p.y=370;p.vy=0}
if(Math.random()<.025)obs.push({x:W+20,y:390-Math.random()*35,w:28+Math.random()*25,h:70+Math.random()*35});
obs.forEach(o=>o.x-=speed);obs=obs.filter(o=>o.x>-80);score+=dt*.01;document.getElementById('score').textContent=Math.floor(score);
for(const o of obs)if(p.x<o.x+o.w&&p.x+p.w>o.x&&p.y<o.y+o.h&&p.y+p.h>o.y){over=true}
draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>

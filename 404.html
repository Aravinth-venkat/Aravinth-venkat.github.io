<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 Network Game</title><style>body{margin:0;background:#06111d;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh;text-align:center}main{width:min(600px,90vw)}canvas{width:100%;background:#0b1c2e;border:1px solid #24415d;border-radius:18px}a{color:#39d7ff}</style></head><body><main><h1>404 — Lost in the network</h1><p>This route doesn't exist. Play while you reconnect: tap/click to keep the packet in the air.</p><canvas id="c" width="600" height="260"></canvas><p>Score: <b id="s">0</b> • <a href="/">Back home</a></p></main><script>let c=document.querySelector("#c"),x=c.getContext("2d"),y=130,v=0,s=0;function jump(){v=-8}c.onclick=jump;onkeydown=e=>{if(e.code==="Space")jump()};function f(){v+=.35;y+=v;if(y>235){y=235;v=-7;s=0}else s++;x.clearRect(0,0,600,260);x.fillStyle="#39d7ff";x.beginPath();x.arc(100,y,14,0,7);x.fill();x.fillStyle="#9278ff";for(let i=0;i<6;i++)x.fillRect(220+i*70,(i%2?160:70),30,30);document.querySelector("#s").textContent=Math.floor(s/10);requestAnimationFrame(f)}f()</script></body></html>

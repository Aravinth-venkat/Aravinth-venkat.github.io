<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerLab · Sign in</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script></head><body><main class="auth-page"><section class="auth-card"><a href="index.html" class="account-btn">← Back to CareerLab</a><div style="margin-top:22px"><div class="eyebrow">CAREERLAB ACCOUNT</div><h1>Welcome back</h1><p class="muted">Sign in to save your account, access your learning journey and manage your CareerLab plan.</p></div><div class="auth-tabs"><button id="signInTab" class="auth-tab active">Sign in</button><button id="signUpTab" class="auth-tab">Create account</button></div><form id="authForm"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters"><div id="nameWrap" class="hidden"><label>Display name</label><input id="authName" autocomplete="name" placeholder="Your name"></div><button id="emailSubmit" class="primary full" type="submit">Sign in</button></form><div class="auth-divider">or continue with</div><div class="social-grid"><button id="googleBtn" class="secondary">Google</button><button id="githubBtn" class="secondary">GitHub</button></div><div class="button-row" style="margin-top:10px"><button id="magicBtn" class="secondary full" type="button">Send me a magic link</button></div><div id="authMessage" class="auth-message"></div></section></main><script src="auth.js"></script></body></html>

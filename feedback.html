<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111d"><meta name="description" content="Aravinth V — ServiceNow Developer, Automation, AI Agents, Moveworks and integrations."><title>Feedback | Aravinth.dev</title><script src="backend-config.js"></script><script src="site.js"></script><style>
:root{--bg:#06111d;--panel:#0b1b2b;--panel2:#10243a;--text:#f5f8fc;--muted:#a9bacb;--line:#28455f;--cyan:#39d7ff;--violet:#9278ff;--ok:#63e6a6;--bad:#ff718d;--gold:#ffd75e}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0,#1a527a33,transparent 34%),var(--bg);line-height:1.65;overflow-x:hidden}a{color:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:950;text-decoration:none}.brand span{color:var(--cyan)}.links{display:flex;gap:18px}.links a{color:var(--muted);text-decoration:none;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;padding:11px 16px;text-decoration:none;font-weight:900;background:var(--panel);cursor:pointer;color:var(--text)}.primary{border:0;color:#04111d;background:linear-gradient(100deg,var(--cyan),var(--violet))}.article{padding:64px 0 100px;max-width:980px}.eyebrow{color:var(--cyan);font-weight:950;letter-spacing:2px;font-size:12px}.lead{color:var(--muted);font-size:18px}.panel{margin-top:28px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:24px;box-shadow:0 20px 60px #0002}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:block;text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:22px;background:var(--panel);transition:.25s}.card:hover{transform:translateY(-4px);border-color:var(--cyan)}.card p{color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:13px;font-weight:850}input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}textarea{min-height:140px;resize:vertical}.error{color:var(--bad);font-size:13px;min-height:20px}.success{display:none;color:var(--ok);font-weight:850;margin-top:10px}.muted{color:var(--muted)}footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted)}.aravinth-theme-toggle{position:fixed;right:18px;top:84px;z-index:90;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer}.aravinth-cursor-dot,.aravinth-cursor-ring{position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);border-radius:50%}.aravinth-cursor-dot{width:7px;height:7px;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}.aravinth-cursor-ring{width:28px;height:28px;border:1px solid #39d7ff88;transition:width .18s,height .18s,border-color .18s}.aravinth-cursor-ring.hover{width:48px;height:48px;border-color:var(--violet)}@media(pointer:coarse){.aravinth-cursor-dot,.aravinth-cursor-ring{display:none}}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.links{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{width:min(1180px,calc(100% - 24px))}.article{padding-top:45px}}
</style></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Aravinth<span>.dev</span></a><div class="links"><a href="index.html">Home</a><a href="index.html#experience">Experience</a><a href="index.html#projects">Projects</a><a href="refer.html">Refer</a><a href="ask.html">Ask</a><a href="chess.html">Challenge</a><a href="feedback.html">Feedback</a></div></div></nav><main class="wrap article"><div class="eyebrow">VISITOR FEEDBACK</div><h1>Before you leave, tell me what you think.</h1><p class="lead">Ratings, comments and suggestions help me improve the portfolio.</p><div class="panel"><form id="f" class="formgrid"><div class="field"><label>Name (optional)</label><input id="name"></div><div class="field"><label>Email (optional)</label><input id="email" type="email"><div id="err" class="error"></div></div><div class="field full"><label>Rating</label><div id="stars" style="display:flex;gap:6px;font-size:32px"><button type="button" data-r="1">☆</button><button type="button" data-r="2">☆</button><button type="button" data-r="3">☆</button><button type="button" data-r="4">☆</button><button type="button" data-r="5">☆</button></div></div><div class="field full"><label>Comments / suggestions</label><textarea id="comment" placeholder="What should I add, change or improve?"></textarea></div><div class="field full"><button class="btn primary" type="submit">Submit feedback</button><div id="ok" class="success"></div></div></form></div></main>
<script>
let rating=0;document.querySelectorAll("#stars button").forEach(b=>b.onclick=()=>{rating=+b.dataset.r;document.querySelectorAll("#stars button").forEach(x=>x.textContent=+x.dataset.r<=rating?"★":"☆")});
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const email=document.getElementById("email").value.trim(),err=document.getElementById("err");err.textContent=email&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(email)?"Please enter a valid email address.":"";if(err.textContent)return;const d={action:"feedback",name:document.getElementById("name").value.trim(),email,rating,comment:document.getElementById("comment").value.trim(),page:location.href};const sent=await window.AravinthSite.send(d);const ok=document.getElementById("ok");ok.textContent=sent?"✓ Thank you for the feedback.":"✓ Saved locally. Connect the Google backend URL to transmit it.";ok.style.display="block";if(!sent)localStorage.setItem("lastFeedback",JSON.stringify(d));e.target.reset();rating=0;document.querySelectorAll("#stars button").forEach(x=>x.textContent="☆")});
</script><footer><div class="wrap">© 2026 Aravinth V • ServiceNow • Automation • AI • <a href="index.html">Home</a></div></footer></body></html>

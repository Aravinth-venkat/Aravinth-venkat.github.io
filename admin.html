<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerLab · Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script></head><body><main class="container admin-page"><div class="section-title"><div><span class="eyebrow">CAREERLAB ADMIN</span><h1>Feature & subscription control</h1><p class="muted">Turn access on only when you are ready. Users do not need to see plan labels until you enable them here.</p></div><a class="account-btn" href="index.html">Back to CareerLab</a></div><section class="card"><h2>Access controls</h2><label class="switch"><input id="plansEnabled" type="checkbox"><span>Show Free & Pro plans to users</span></label><div class="grid three"><label>Visitor Explorer limit<input id="visitorExplorer" type="number" min="0" value="3"></label><label>Free Explorer daily limit<input id="freeExplorer" type="number" min="0" value="10"></label><label>Free Mock Interviews daily limit<input id="freeMock" type="number" min="0" value="2"></label></div><div class="grid two"><label>Pro monthly price (₹)<input id="proPrice" type="number" min="1" value="499"></label><label>Visitor sign-in trigger after uses<input id="visitorSignInAfter" type="number" min="1" value="3"></label></div><button id="saveConfig" class="primary">Save settings</button><div id="adminMsg" class="auth-message"></div></section><section class="card"><h2>Feature availability</h2><div id="featureGrid" class="admin-feature-grid"></div></section><section class="card"><h2>Payment tracking</h2><div id="paymentStats" class="stats-grid"></div><div id="paymentTable" class="table-wrap">Loading…</div></section></main><script src="admin.js"></script></body></html>

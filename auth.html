<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerLab · Account</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script></head><body><main class="auth-page"><section class="auth-card"><a href="index.html" class="account-btn">← Back to CareerLab</a><span class="eyebrow">CAREERLAB ACCOUNT</span><h1 id="authTitle">Continue your CareerLab journey</h1><p id="authIntro" class="muted">Create a free account when you want to save progress, continue after visitor limits, and unlock the features your account is eligible for.</p><div class="auth-tabs"><button id="signInTab" class="auth-tab active">Sign in</button><button id="signUpTab" class="auth-tab">Create account</button><button id="phoneTab" class="auth-tab">Phone OTP</button></div><form id="authForm"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters"><div id="nameWrap" class="hidden"><label>Display name</label><input id="authName" autocomplete="name" placeholder="Your name"></div><button id="emailSubmit" class="primary full" type="submit">Sign in</button></form><div id="phonePanel" class="hidden"><label>Phone number</label><input id="phoneNumber" type="tel" autocomplete="tel" placeholder="+91 9876543210"><button id="sendOtpBtn" class="primary full">Send OTP</button><div id="otpWrap" class="hidden"><label>OTP</label><input id="phoneOtp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button id="verifyOtpBtn" class="primary full">Verify OTP</button></div></div><div class="auth-links"><button id="forgotBtn" class="link-btn">Forgot password?</button></div><div class="auth-divider">or continue with</div><div class="social-grid"><button id="googleBtn" class="secondary">Google</button><button id="githubBtn" class="secondary">GitHub</button><button id="microsoftBtn" class="secondary">Microsoft</button></div><button id="magicBtn" class="secondary full" type="button">Send me a magic link</button><div id="resetPanel" class="hidden"><h3>Set a new password</h3><input id="newPassword" type="password" minlength="8" placeholder="New password"><button id="savePasswordBtn" class="primary full">Update password</button></div><div id="authMessage" class="auth-message"></div></section></main><script src="auth.js"></script></body></html>

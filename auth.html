<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>CareerLab · Account</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-config.js"></script>
</head>
<body>
<main class="auth-page">
  <section class="auth-card" aria-label="CareerLab account">
    <div class="auth-topline">
      <a href="index.html" class="account-btn">← Back to CareerLab</a>
      <span class="eyebrow">CAREERLAB ACCOUNT</span>
    </div>

    <div class="auth-heading">
      <div class="auth-logo">CL</div>
      <div>
        <h1 id="authTitle">Continue your CareerLab journey</h1>
        <p id="authIntro" class="muted">Sign in or create your free CareerLab account using email.</p>
      </div>
    </div>

    <div class="auth-tabs" role="tablist" aria-label="Account options">
      <button id="signInTab" class="auth-tab active" type="button">Sign in</button>
      <button id="signUpTab" class="auth-tab" type="button">Create account</button>
    </div>

    <form id="authForm" class="auth-form">
      <div id="nameWrap" class="field hidden">
        <label for="authName">Name</label>
        <input id="authName" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="authEmail">Email</label>
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
      </div>
      <button id="emailSubmit" class="primary full auth-main-btn" type="submit">Sign in</button>
    </form>

    <div class="auth-links">
      <button id="forgotBtn" class="link-btn" type="button">Forgot password?</button>
    </div>

    <div id="confirmPanel" class="hidden confirm-panel">
      <div class="confirm-icon">✉</div>
      <div>
        <h3>Check your email</h3>
        <p id="confirmText" class="muted">We sent a confirmation link to your email.</p>
      </div>
      <button id="resendBtn" class="secondary full" type="button">Resend confirmation email</button>
      <div id="resendTimer" class="timer-text" aria-live="polite"></div>
    </div>

    <div id="resetPanel" class="hidden reset-panel">
      <div class="reset-heading">
        <h3>Create a new password</h3>
        <span>Secure your account</span>
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      </div>
      <button id="savePasswordBtn" class="primary full" type="button">Update password</button>
    </div>

    <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>
    <p class="auth-footer-note">Email authentication powered by CareerLab and Supabase.</p>
  </section>
</main>
<script src="auth.js"></script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111d"><meta name="description" content="Aravinth V — ServiceNow Developer, Automation, AI Agents, Moveworks and integrations."><title>ServiceNow Quiz | Aravinth.dev</title><style>

.cursor-dot,.cursor-ring{position:fixed;pointer-events:none;z-index:1000;border-radius:50%;transform:translate(-50%,-50%}.cursor-dot{width:7px;height:7px;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}.cursor-ring{width:30px;height:30px;border:1px solid #39d7ff88}.cursor-hover .cursor-ring{width:48px;height:48px;border-color:var(--violet)}

<main class="wrap article"><a class="crumb" href="index.html">← Home</a><div class="eyebrow" style="margin-top:35px">SERVICE NOW QUIZ ARENA</div><h1>Can you beat the platform?</h1><p class="lead">Answer technical questions and build your score.</p><div class="quiz"><div id="qbox"></div><div class="actions"><button class="btn" id="next">Next question →</button><a class="btn" href="index.html">Exit</a></div></div></main><script>
const qs=[["Which script runs server-side around database operations?",["Client Script","Business Rule","UI Policy","Catalog Client Script"],1],["What does GlideAjax commonly enable?",["CSS changes","Client-to-server calls","Database backup","Email encryption"],1],["What is IRE used for in CMDB?",["UI styling","CI identification and reconciliation","Email routing","Password reset"],1],["Which is a low-code automation capability?",["Flow Designer","GlideRecord","CSS","HTML"],0],["What should never be placed in public frontend JavaScript?",["A heading","A button","An AI provider secret key","A paragraph"],2]];let i=0,score=0,locked=false;
function render(){locked=false;let q=qs[i];qbox.innerHTML="<h2>"+(i+1)+". "+q[0]+"</h2>"+q[1].map((o,n)=>`<button class="option" data-n="${n}">${o}</button>`).join("");document.querySelectorAll(".option").forEach(b=>b.onclick=()=>pick(+b.dataset.n))}
function pick(n){if(locked)return;locked=true;let q=qs[i];document.querySelectorAll(".option").forEach((b,k)=>{if(k===q[2])b.classList.add("correct");if(k===n&&n!==q[2])b.classList.add("wrong")});if(n===q[2])score+=10}
next.onclick=()=>{if(!locked)return;if(i<qs.length-1){i++;render()}else{qbox.innerHTML=`<h2>Quiz complete 🎉</h2><p>Your score: <b>${score}/${qs.length*10}</b></p>`;next.textContent="Restart";next.onclick=()=>location.reload()}};render()
</script>

<script>
const dot=document.getElementById('cursorDot'),ring=document.getElementById('cursorRing');let mx=0,my=0,rx=0,ry=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px'});
(function loop(){rx+=(mx-rx)*.18;ry+=(my-ry)*.18;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop)})();
document.querySelectorAll('a,button,.card,input,textarea,select').forEach(e=>{e.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));e.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'))});
</script></body></html>
